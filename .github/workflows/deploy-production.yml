name: Deploy production

on:
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lifeos-web

jobs:
  deploy:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'development' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Publish runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Compose file
        run: |
          scp -P "${{ secrets.VPS_SSH_PORT }}" \
            docker-compose.production.yml \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/opt/lifeos-web/"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          ssh -p "${{ secrets.VPS_SSH_PORT }}" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "GHCR_USERNAME='${{ github.actor }}' GHCR_TOKEN='$GHCR_TOKEN' APP_IMAGE='${{ env.IMAGE_NAME }}:${{ github.sha }}' bash -s" <<'EOF'
          set -euo pipefail
          cd /opt/lifeos-web
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          APP_IMAGE="$APP_IMAGE" docker compose --env-file .env.production -f docker-compose.production.yml pull
          docker logout ghcr.io
          APP_IMAGE="$APP_IMAGE" docker compose --env-file .env.production -f docker-compose.production.yml up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3002/ > /dev/null; then
              printf 'APP_IMAGE=%s\n' "$APP_IMAGE" > .deployment.env
              chmod 600 .deployment.env
              exit 0
            fi
            sleep 2
          done
          exit 1
          EOF
